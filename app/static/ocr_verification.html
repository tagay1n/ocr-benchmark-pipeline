<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OCR | OCR benchmark pipeline</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <style>
      :root {
        --bg: #f3f1eb;
        --surface: #fffdf7;
        --ink: #1e1f1c;
        --muted: #63635f;
        --accent: #0b7a75;
        --danger: #a52222;
        --border: #e0dccf;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 100% 0, #d6ebe7 0, transparent 30%),
          radial-gradient(circle at 0 100%, #f7e3cf 0, transparent 32%),
          var(--bg);
      }

      main {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 8px 6px;
      }

      .nav-strip { position: fixed; top: 8px; left: 6px; z-index: 45; }

      .back-nav {
        width: 44px;
        height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(31, 35, 41, 0.08);
      }

      .back-nav:hover { background: #f5f1e6; }

      .nav-icon {
        width: 20px;
        height: 20px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0 8px 62px;
        background: rgba(243, 241, 235, 0.9);
        backdrop-filter: blur(1px);
      }

      h1 { margin: 0; font-size: 26px; }
      button, select, textarea { font: inherit; }

      .header-actions,
      .toolbar-row,
      #counters,
      .finding-head,
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary,
      .variant,
      .actions button { background: #fff; color: var(--accent); }
      .actions button.primary { background: var(--accent); color: #fff; }
      button.danger { border-color: var(--danger); background: var(--danger); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      #run-btn.is-busy,
      #recalculate-btn.is-busy { position: relative; color: transparent; }

      #run-btn.is-busy::after,
      #recalculate-btn.is-busy::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 14px;
        height: 14px;
        margin: auto;
        border-radius: 999px;
        animation: spin 720ms linear infinite;
      }

      #run-btn.is-busy::after {
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
      }

      #recalculate-btn.is-busy::after {
        border: 2px solid rgba(11, 122, 117, 0.3);
        border-top-color: var(--accent);
      }

      select,
      textarea {
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
      }

      .content-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding-top: 6px;
      }

      .panel,
      .finding {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .verification-toolbar { position: sticky; top: 0; z-index: 10; }
      .toolbar-row { justify-content: space-between; }
      .filter-control { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
      #progress { margin-left: auto; font-size: 13px; color: var(--muted); }
      #counters { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .counter, .badge { border-radius: 999px; padding: 3px 8px; background: #e7e9e7; }
      #empty { padding: 40px; text-align: center; color: var(--muted); }

      .finding-head { margin-bottom: 12px; }
      .finding-head strong { margin-right: auto; }
      .badge.reduced, .badge.manual { background: #fff0c2; }
      .badge.disagreement { background: #f7d2ce; }
      .badge.agreed { background: #dcefdc; }
      .finding-grid { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(360px, 1.4fr); gap: 14px; }
      .source-panel { border-radius: 10px; background: #eeeae0; padding: 10px; }
      .source-panel img { display: block; width: 100%; max-height: 340px; object-fit: contain; background: #fff; border: 1px solid var(--border); }
      .source-panel a { display: inline-block; margin-top: 7px; color: var(--accent); font-size: 12px; }
      .variants { display: grid; gap: 9px; }
      button.variant { width: 100%; padding: 10px; text-align: left; border: 2px solid var(--border); color: var(--ink); font-weight: 400; }
      button.variant.selected { border-color: var(--accent); background: #eef6f6; }
      .variant-label { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
      .variant pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
      .variant mark { background: #ffd6a8; }
      .variant del { color: #9f3932; background: #f8dbd8; }
      .task-errors { margin: 8px 0 0; font-size: 12px; color: #8a4038; }
      .draft { width: 100%; min-height: 100px; margin-top: 10px; resize: vertical; font-family: ui-monospace, monospace; }
      .actions { margin-top: 8px; }
      .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 20px; }
      .pager button { padding: 7px 12px; }
      #page-label { min-width: 140px; text-align: center; color: var(--muted); font-size: 13px; }

      .busy-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      button.secondary .busy-dot,
      .actions button:not(.primary) .busy-dot { border-color: rgba(11, 122, 117, 0.3); border-top-color: var(--accent); }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 850px) {
        .nav-strip { top: 16px; left: 16px; }
        .back-nav { width: 40px; height: 40px; }
        .nav-icon { width: 18px; height: 18px; }
        .header { align-items: flex-start; padding-left: 56px; }
        .finding-grid { grid-template-columns: 1fr; }
        #progress { width: 100%; margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="nav-strip">
        <a class="back-nav" href="/" aria-label="Back to Dashboard" title="Back to Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M10 7 5 12l5 5"></path>
            <path d="M5 12h9a5 5 0 0 0 0-10h-2"></path>
          </svg>
        </a>
      </div>
      <section class="header">
        <h1>Verify OCR</h1>
        <div class="header-actions">
          <button id="recalculate-btn" class="secondary" type="button">Recalculate</button>
          <button id="run-btn" type="button">Start verification</button>
        </div>
      </section>
      <div class="content-scroll">
        <section class="panel verification-toolbar">
          <div class="toolbar-row">
            <label class="filter-control" for="filter">
              Findings
              <select id="filter">
                <option value="attention">Needs attention</option>
                <option value="agreement">Agreements</option>
                <option value="waiting">Waiting</option>
                <option value="not_started">Not started</option>
                <option value="stale">Stale</option>
                <option value="resolved">Resolved</option>
                <option value="all">All</option>
              </select>
            </label>
            <span id="progress"></span>
          </div>
          <div id="counters"></div>
        </section>
        <div id="empty" hidden>No verification findings in this view.</div>
        <div id="findings"></div>
        <nav class="pager" aria-label="Verification findings pages">
          <button id="page-prev" class="secondary" type="button">Previous</button>
          <span id="page-label"></span>
          <button id="page-next" class="secondary" type="button">Next</button>
        </nav>
      </div>
    </main>
    <script type="module" src="/static/js/ocr_verification_page.mjs"></script>
  </body>
</html>
